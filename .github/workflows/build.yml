name: Сборка Zastra

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '27.2.12479018'

jobs:
  native:
    name: Нативная сборка (tun2socks и QuickJS)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Кэш нативных библиотек
        id: cache
        uses: actions/cache@v6
        with:
          path: native-out
          key: native-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('app/src/main/jni/**') }}

      - name: Установить NDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;${{ env.NDK_VERSION }}'

      - name: Собрать библиотеки (ndk-build)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          mkdir -p native-out
          cd app/src/main/jni
          "$NDK/ndk-build" -j"$(nproc)" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/native-out/jniLibs" \
            NDK_OUT="$RUNNER_TEMP/ndk-obj"
          find "$GITHUB_WORKSPACE/native-out" -name '*.so'

      - uses: actions/upload-artifact@v7
        with:
          name: native-libs
          path: native-out/jniLibs
          if-no-files-found: error

  apk:
    name: Сборка APK
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.ver.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Получить нативные библиотеки
        uses: actions/download-artifact@v8
        with:
          name: native-libs
          path: app/src/main/jniLibs

      - name: Определить версию
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Подготовить ключ подписи (если задан в секретах)
        env:
          KEYSTORE_B64: ${{ secrets.ZASTRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zastra.jks"
            echo "ZASTRA_KEYSTORE_FILE=$RUNNER_TEMP/zastra.jks" >> "$GITHUB_ENV"
          else
            echo "Секрет ZASTRA_KEYSTORE_BASE64 не задан: APK будет подписан отладочным ключом"
          fi

      - name: Модульные тесты
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest -PprebuiltNative=true

      - name: Собрать APK
        env:
          ZASTRA_KEYSTORE_PASSWORD: ${{ secrets.ZASTRA_KEYSTORE_PASSWORD }}
          ZASTRA_KEY_ALIAS: ${{ secrets.ZASTRA_KEY_ALIAS }}
          ZASTRA_KEY_PASSWORD: ${{ secrets.ZASTRA_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease -PprebuiltNative=true \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            -PversionName="${{ steps.ver.outputs.name }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Zastra-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: Zastra-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Публикация релиза
    needs: apk
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Zastra-${{ needs.apk.outputs.version }}
          path: dist
      - name: Создать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/*.apk \
              --title "Zastra $VERSION" --generate-notes
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Ручной запуск: тег v<версия> создаётся автоматически на текущем коммите
            gh release create "v$VERSION" dist/*.apk \
              --target "$GITHUB_SHA" \
              --title "Zastra $VERSION" --generate-notes
          else
            # Каждый push в main — отдельный пре-релиз с APK
            gh release create "build-$GITHUB_RUN_NUMBER" dist/*.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "Zastra $VERSION (сборка $GITHUB_RUN_NUMBER)" \
              --notes "Автоматическая сборка из коммита $GITHUB_SHA"
          fi
