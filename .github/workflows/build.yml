name: Сборка Zastra

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: 'platforms;android-35'
  ANDROID_BUILD_TOOLS: 'build-tools;35.0.0'
  ANDROID_NDK: 'ndk;27.2.12479018'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Установить Android SDK и NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "$ANDROID_NDK"

      - name: Определить версию
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Подготовить ключ подписи (если задан в секретах)
        env:
          KEYSTORE_B64: ${{ secrets.ZASTRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zastra.jks"
            echo "ZASTRA_KEYSTORE_FILE=$RUNNER_TEMP/zastra.jks" >> "$GITHUB_ENV"
            echo "Ключ подписи найден: APK будет подписан вашим ключом"
          else
            echo "Секрет ZASTRA_KEYSTORE_BASE64 не задан: APK будет подписан отладочным ключом"
          fi

      - name: Модульные тесты
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Собрать APK
        env:
          ZASTRA_KEYSTORE_PASSWORD: ${{ secrets.ZASTRA_KEYSTORE_PASSWORD }}
          ZASTRA_KEY_ALIAS: ${{ secrets.ZASTRA_KEY_ALIAS }}
          ZASTRA_KEY_PASSWORD: ${{ secrets.ZASTRA_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionCode="${GITHUB_RUN_NUMBER}" \
            -PversionName="${{ steps.ver.outputs.name }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Zastra-${{ steps.ver.outputs.name }}.apk"

      - name: Сохранить APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: Zastra-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Опубликовать релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "Zastra ${{ steps.ver.outputs.name }}" \
            --generate-notes
